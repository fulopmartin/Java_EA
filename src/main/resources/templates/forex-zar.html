<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hu" id="htmlRoot">
<head th:replace="~{fragments/layout :: head('Forex Zárás - Beadandó')}"></head>
<body>
<div id="landing">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <section class="sp" style="padding-top:120px;min-height:85vh">
        <div class="container">
            <h1 class="stitle text-center mb-4">
                Forex <span class="gt">Pozíciózárás</span>
            </h1>

            <div th:if="${success}" class="alert alert-success" role="status"
                 th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" role="alert"
                 th:text="${error}"></div>

            <div class="gc p-4">
                <form th:action="@{/forex-zar}" method="post" class="row g-3 align-items-end">
                    <div class="col-md-8">
                        <label for="tradeId" class="form-label">Trade ID</label>
                        <input id="tradeId" name="tradeId" type="number"
                               min="1" step="1" required
                               class="form-control bg-dark text-light border-secondary">
                    </div>

                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100">
                            Teljes ügylet zárása piaci áron
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
